# Uploads the web app and the PHP API to dogado (phpexpert.de/vocs) on every push to main.
#
# Secrets of the environment "Dogado" (Settings → Environments → Dogado):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  – FTP access from the dogado customer area
#   VOCS_KEY                                 – your own key for the stats API
# Optional variables (same environment):
#   FTP_DIR       target folder relative to the FTP login, with trailing slash (default: ./,
#                 the login h26331_vocs already starts in /httpdocs/vocs)
#   FTP_PROTOCOL  ftps (default) or ftp
#   FTP_SECURITY  strict (default) or loose, if the FTPS certificate does not match the host name
name: Deploy to dogado

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Dogado
    steps:
      - name: Check secrets
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -n "$FTP_SERVER" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::FTP-Secrets fehlen – Deploy übersprungen."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Write server config
        if: steps.check.outputs.ready == 'true'
        env:
          VOCS_KEY: ${{ secrets.VOCS_KEY }}
        run: |
          if [ -z "$VOCS_KEY" ]; then echo "::error::Secret VOCS_KEY fehlt."; exit 1; fi
          hash=$(printf '%s' "$VOCS_KEY" | sha256sum | cut -d' ' -f1)
          printf "<?php\nreturn ['key_sha256' => '%s'];\n" "$hash" > api/config.php

      # lftp instead of a Node FTP action: it handles FTPS servers that require
      # TLS session reuse on the data connection (dogado resets it otherwise).
      - name: Upload via FTP
        if: steps.check.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || './' }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_SECURITY: ${{ vars.FTP_SECURITY || 'strict' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          # Only the files the web app needs; api/data/ on the server is never touched (no --delete).
          mkdir site
          cp -r index.html manifest.json sw.js css js assets api site/
          ssl=$([ "$FTP_PROTOCOL" = "ftp" ] && echo false || echo true)
          verify=$([ "$FTP_SECURITY" = "loose" ] && echo no || echo yes)
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" <<EOF
          set ftp:ssl-force $ssl
          set ftp:ssl-protect-data $ssl
          set ssl:verify-certificate $verify
          set ftp:passive-mode true
          set net:timeout 20
          set net:max-retries 2
          mkdir -p -f $FTP_DIR
          mirror --reverse --no-perms --verbose site/ $FTP_DIR
          bye
          EOF
