<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ViperVocs</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6750A4">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    
    <!-- Styles -->
    <link rel="stylesheet" href="assets/fonts/Outfit/fonts.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="app-header">
        <div class="logo-area">
            <h1>ViperVocs</h1>
        </div>
        <div class="controls-area">
            <select id="lesson-select" class="material-select">
                <!-- Options are generated dynamically by app.js -->
            </select>
            <select id="language-select" class="material-select">
                <option value="pl">Polnisch</option>
            </select>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle Dark Mode">
                <span class="icon-moon">🌙</span>
                <span class="icon-sun">☀️</span>
            </button>
        </div>
    </header>

    <div class="progress-container">
        <div class="progress-pill">
            <div id="progress-fill" class="progress-fill" style="width: 0%;"></div>
        </div>
        <div id="progress-text" class="progress-text">0 / 23 Paare</div>
    </div>

    <main class="game-board" id="game-board">
        <div class="column-left" id="col-left">
            <!-- Cards will be injected here via JS -->
        </div>
        <div class="column-right" id="col-right">
            <!-- Cards will be injected here via JS -->
        </div>
    </main>

    <!-- Grammatik-Regeln (nur bei Verb-Lektionen sichtbar) -->
    <section id="lesson-rules" class="lesson-rules" hidden>
        <button type="button" id="rules-toggle" class="rules-toggle" aria-expanded="true" aria-controls="rules-body">
            <span class="rules-title">📘 Grammatik: So wird die Form gebildet</span>
            <span class="rules-chevron" aria-hidden="true">▾</span>
        </button>
        <div id="rules-body" class="rules-body"></div>
    </section>

    <!-- Completion Modal -->
    <dialog id="completion-modal" class="completion-modal">
        <div class="modal-content">
            <h2>Lektion abgeschlossen! 🎉</h2>
            <div class="stats">
                <p>✅ <span id="stat-pairs">23</span> Paare gelöst</p>
                <p>❌ <span id="stat-errors">0</span> Fehlversuche</p>
                <p>⏱ Zeit: <span id="stat-time">0:00</span></p>
            </div>
            <div class="modal-actions">
                <button id="btn-replay" class="btn-primary">Nochmal</button>
                <button id="btn-menu" class="btn-secondary">Anderes Thema</button>
            </div>
        </div>
    </dialog>

    <!-- Scripts -->
    <script src="js/vocabulary.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
